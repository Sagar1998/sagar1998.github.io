<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Sagar Kuvar</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/css/style.css?v=3">
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { }
    </script>
</head>

<body>
    <main class="section contact" style="min-height:100vh;display:grid;place-items:center;border:0">
        <div class="wrap">
            <p class="section__index">404 / Not found</p>
            <h2>Nothing exposed at this path.</h2>
            <p class="contact__lead">The page you were looking for doesn't exist or has moved.</p>
            <div class="contact__links">
                <a class="btn btn--primary" href="/">Back to the homepage</a>
            </div>
        </div>
    </main>
</body>

</html>
